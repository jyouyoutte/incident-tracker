spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      platform: h2

  # Enable H2 console during tests if needed
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: INFO
    com.incident.tracker: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

