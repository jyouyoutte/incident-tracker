info:
  name: create-incident
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/incidents
  body:
    type: json
    data: |-
      {
        "title": "Bug login",
        "description": "Impossible de se connecter à l'application via LDAP",
        "priority": "MODERATE",
        "status": "OPEN"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Le statut de réponse est 201 ou 200", function() {
          expect(res.getStatus()).to.be.oneOf([200, 201]);
        });

        test("L'incident a bien été créé avec un ID", function() {
          const data = res.getBody();
          expect(data.id).to.be.a('number');
          expect(data.id).to.be.at.least(1);
        });

        test("Les données renvoyées correspondent à l'envoi", function() {
          const data = res.getBody();
          expect(data.title).to.equal("Bug login");
          expect(data.status).to.equal("OPEN"); // Valeur par défaut attendue
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
