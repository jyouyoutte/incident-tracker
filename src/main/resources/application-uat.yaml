spring:
  application:
    name: incident-tracker

  datasource:
    url: {SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      jpa-properties:
         hibernate:
           format_sql: true
    # display SQL queries in the console (useful for dev L2/L3)
      update show-sql: true


logging:
  level:
    root: INFO                        # Le reste reste propre
    com.incident.tracker: DEBUG        # Votre code métier
    org.springframework.web: DEBUG    # Détails des requêtes HTTP
    org.hibernate.SQL: DEBUG          # Pour voir les requêtes SQL


